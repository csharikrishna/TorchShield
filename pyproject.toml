[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahcc-gpu-engine"
version = "0.2.0"
description = "Experimental exact-integer AHCC research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0.0", "cryptography>=42.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["run_all"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ahcc*", "tests*", "benchmarks*", "demos*"]
